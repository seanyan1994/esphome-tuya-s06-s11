substitutions:
  device_name: "tuya-s11-ir-rf"
  friendly_name: "Tuya S11 紅外線與 433MHz 射頻控制器"
  climate_name: "客廳冷氣"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - "-DS11_HARDWARE=1"
  includes:
    - ../s06_hitachi_hw.h
    - ../components/tuya_rf/cmt2300a.h
    - ../components/tuya_rf/cmt2300a_defs.h
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          // 發射紅外線期間自動暫停 CMT2300A 433MHz 接收中斷，防止中斷風暴干擾時序
          s06_hw::set_rf_pause_hook([](bool pause) {
            if (pause) {
              s11_rf->turn_off_receiver();
            } else {
              s11_rf->turn_on_receiver();
            }
          });

bk72xx:
  board: generic-bk7238-tuya

external_components:
  - source:
      type: local
      path: ../components
    components: [ hitachi_ac344, maxe_coolix, tuya_rf ]

# S11 內建 CMOSTEK CMT2300A 433.92MHz OOK 射頻收發器 (實機量測驗證腳位)
tuya_rf:
  id: s11_rf
  sclk_pin: P14
  mosi_pin: P16
  csb_pin: P26
  fcsb_pin: P17
  tx_pin: P23
  rx_pin:
    number: P22
    mode:
      input: true
      pullup: true
  frequency: 433.92MHz
  receiver_disabled: false
  buffer_size: 2000
  filter: 200us
  idle: 15ms
  dump: [ rc_switch ]

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

safe_mode:
  num_attempts: 10
  boot_is_good_after: 5s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  ap:
    ssid: "${device_name}-Fallback"

captive_portal:

# S11 紅外線接收頭 (P24, Active-LOW)
remote_receiver:
  - id: ir_rx
    pin:
      number: P24
      inverted: true
      mode: INPUT_PULLUP
    tolerance: 45%
    buffer_size: 2500
    idle: 80ms
    dump: []

# S11 藍色狀態指示燈 (P21, Active-HIGH)
status_led:
  pin:
    number: P21
    inverted: false

# S11 實體配對按鈕 (P20)
binary_sensor:
  - platform: gpio
    pin:
      number: P20
      mode: INPUT
      inverted: false
    name: "實體按鈕"
    id: s11_physical_button
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms

# 空調實體 (可選 hitachi_ac344 或 maxe_coolix，紅外發射自動走 S11 硬體 PWM3 / P9)
climate:
  - platform: hitachi_ac344
    name: ${climate_name}
    id: ac_climate
    receiver_id: ir_rx
    repeat: 1
